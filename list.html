<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070a">
<meta name="description" content="按分类、类型、年份、地区浏览影视收藏馆里的全部影视。">
<title>片库 · 乌海局域网的影视收藏馆</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b1a18'/%3E%3Cg fill='none' stroke='%234ee79b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='16' cy='7.5' r='2.4'/%3E%3Ccircle cx='7.5' cy='24' r='2.4'/%3E%3Ccircle cx='16' cy='24' r='2.4'/%3E%3Ccircle cx='24.5' cy='24' r='2.4'/%3E%3Cpath d='M16 10v4'/%3E%3Cpath d='M7.5 21.6V18h17v3.6'/%3E%3Cpath d='M16 14v7.6'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="list">

<header class="site-header">
  <a class="logo" href="index.html">
    <span class="logo-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="4" r="2"/><circle cx="4.5" cy="20" r="2"/>
        <circle cx="12" cy="20" r="2"/><circle cx="19.5" cy="20" r="2"/>
        <path d="M12 6v5"/><path d="M4.5 18v-3h15v3"/><path d="M12 11v7"/>
      </svg>
    </span>
    <span class="logo-text" data-site="short">影视收藏馆</span>
    <span class="logo-owner" data-site="owner">乌海局域网</span>
  </a>

  <nav class="main-nav">
    <a href="index.html" data-nav="home">首页</a>
    <a href="list.html" data-nav="list">片库</a>
    <a href="index.html#categories">分类</a>
  </nav>

  <div class="header-search">
    <svg class="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
    </svg>
    <label class="sr-only" for="q">搜索影视名称</label>
    <input id="q" type="search" placeholder="搜索片名、演员、类型…" autocomplete="off">
    <button type="button" class="clear-btn" aria-label="清空搜索">×</button>
    <div class="suggest" role="listbox"></div>
  </div>
</header>

<main>
  <div class="page-head">
    <h1 class="page-title">片库</h1>
    <p class="page-desc">按分类、类型、年份、地区筛选,或直接在上方搜索片名。</p>
  </div>

  <!-- 筛选栏:滚动时吸附在顶栏下面 -->
  <div class="filters">
    <div class="cat-tabs" id="cat-tabs" role="tablist" aria-label="影视分类"></div>

    <div class="filter-row">
      <span class="filter-label">类型</span>
      <div class="filter-row" id="f-genre" style="margin:0"></div>
    </div>
    <div class="filter-row">
      <span class="filter-label">年份</span>
      <div class="filter-row" id="f-year" style="margin:0"></div>
    </div>
    <div class="filter-row">
      <span class="filter-label">地区</span>
      <div class="filter-row" id="f-region" style="margin:0"></div>
    </div>
  </div>

  <div class="result-bar">
    <span class="result-count" id="result-count" aria-live="polite"></span>
    <div class="active-filters" id="active-filters" hidden></div>
    <label class="sr-only" for="sort">排序方式</label>
    <select class="sort-select" id="sort">
      <option value="added">最新接入</option>
      <option value="year">年份最新</option>
      <option value="rating">评分最高</option>
      <option value="title">片名排序</option>
    </select>
  </div>

  <div class="grid-area">
    <div id="grid" class="poster-grid"></div>
  </div>
</main>

<footer class="site-footer">
  <span class="logo"><span class="logo-text" data-site="short">影视收藏馆</span></span>
  <span class="footer-sign">馆主 · <b data-site="owner">乌海局域网</b></span>
  <span data-site="footerNote">个人影视资料库 · 仅作整理与收藏展示,不提供在线播放</span>
  <nav>
    <a href="index.html">首页</a>
    <a href="list.html">片库</a>
    <a href="index.html#categories">分类</a>
    <a href="admin.html">录入台</a>
  </nav>
</footer>

<nav class="tab-bar" aria-label="底部导航">
  <a href="index.html" data-nav="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/></svg>
    首页
  </a>
  <a href="list.html" data-nav="list">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    片库
  </a>
  <a href="index.html#categories">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>
    分类
  </a>
  <a href="list.html#q">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    搜索
  </a>
</nav>

<script src="assets/js/site.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
