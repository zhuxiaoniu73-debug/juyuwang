<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070a">
<meta name="description" content="影视收藏馆 —— 个人影视资料库,整理、分类和展示电影、电视剧、综艺、纪录片。">
<title>乌海舰的影视收藏馆</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d1b2c'/%3E%3Cg fill='none' stroke='%23dcb877' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='16' cy='7' r='2.2'/%3E%3Cpath d='M16 9.5v14'/%3E%3Cpath d='M11.5 13h9'/%3E%3Cpath d='M8 17.5c0 4.2 3.6 6.6 8 6.6s8-2.4 8-6.6'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="home">

<header class="site-header">
  <a class="logo" href="index.html">
    <span class="logo-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="4" r="2"/><path d="M12 6v15"/><path d="M8 9.5h8"/>
        <path d="M4.5 14c0 4 3.4 6.6 7.5 6.6s7.5-2.6 7.5-6.6"/>
        <path d="M4.5 14H7.6M19.5 14h-3.1"/>
      </svg>
    </span>
    <span class="logo-text" data-site="short">影视收藏馆</span>
    <span class="logo-owner" data-site="owner">乌海舰</span>
  </a>

  <nav class="main-nav">
    <a href="index.html" data-nav="home">首页</a>
    <a href="list.html" data-nav="list">片库</a>
    <a href="index.html#categories">分类</a>
  </nav>

  <div class="header-search">
    <svg class="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
    </svg>
    <label class="sr-only" for="q">搜索影视名称</label>
    <input id="q" type="search" placeholder="搜索片名、演员、类型…" autocomplete="off">
    <button type="button" class="clear-btn" aria-label="清空搜索">×</button>
    <div class="suggest" role="listbox"></div>
  </div>
</header>

<main>
  <!-- ============================ 头图 ============================ -->
  <section class="hero">
    <div class="hero-bg" aria-hidden="true"></div>
    <div class="hero-radar" aria-hidden="true"></div>
    <div class="hero-art" id="hero-art" aria-hidden="true"></div>
    <div class="hero-inner">
      <span class="hero-kicker" data-site="kicker">乌海舰的私人片库</span>
      <h1><span data-site="line1">看过的好片</span><br><span class="accent" data-site="line2">都收在这儿</span></h1>
      <p data-site="intro">这是我自己的片库。看过觉得值得留下的,就记一笔。</p>
      <div class="hero-actions">
        <a class="btn btn-primary" href="list.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
            <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
          </svg>
          浏览全部影视
        </a>
        <a class="btn btn-ghost" href="#categories">按分类找片</a>
      </div>
      <div class="hero-stats">
        <div class="hero-stat"><b data-stat="total">—</b><span>入列影视</span></div>
        <div class="hero-stat"><b data-stat="cat">—</b><span>大 类</span></div>
        <div class="hero-stat"><b data-stat="region">—</b><span>地 区</span></div>
        <div class="hero-stat"><b data-stat="year">—</b><span>年 份</span></div>
      </div>
    </div>
  </section>

  <!-- ========================== 热门影视 ========================== -->
  <section class="section" id="sec-hot">
    <div class="section-head">
      <h2 class="section-title"><span class="bar"></span>热门影视</h2>
      <span class="section-sub">常被翻出来的几部</span>
      <a class="section-more" href="list.html?sort=rating">全部 ›</a>
    </div>
    <div class="row-wrap">
      <button class="row-nav prev" type="button" aria-label="向左滚动">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="row" id="row-hot"></div>
      <button class="row-nav next" type="button" aria-label="向右滚动">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
    </div>
  </section>

  <!-- ========================== 最新添加 ========================== -->
  <section class="section" id="sec-recent">
    <div class="section-head">
      <h2 class="section-title"><span class="bar"></span>新近入列</h2>
      <span class="section-sub">按入列日期排</span>
      <a class="section-more" href="list.html?sort=added">全部 ›</a>
    </div>
    <div class="row-wrap">
      <button class="row-nav prev" type="button" aria-label="向左滚动">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="row" id="row-recent"></div>
      <button class="row-nav next" type="button" aria-label="向右滚动">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
    </div>
  </section>

  <!-- ========================== 分类入口 ========================== -->
  <section class="section" id="categories">
    <div class="section-head">
      <h2 class="section-title"><span class="bar"></span>分类浏览</h2>
      <span class="section-sub">点大类进片库,点标签直接筛类型</span>
    </div>
    <div class="cat-grid" id="cat-grid"></div>
  </section>

  <!-- ========================== 高分推荐 ========================== -->
  <section class="section" id="sec-top">
    <div class="section-head">
      <h2 class="section-title"><span class="bar"></span>高分收藏</h2>
      <span class="section-sub">评分靠前的片子</span>
      <a class="section-more" href="list.html?sort=rating">全部 ›</a>
    </div>
    <div class="row-wrap">
      <button class="row-nav prev" type="button" aria-label="向左滚动">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="row" id="row-top"></div>
      <button class="row-nav next" type="button" aria-label="向右滚动">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
    </div>
  </section>
</main>

<footer class="site-footer">
  <span class="logo"><span class="logo-text" data-site="short">影视收藏馆</span></span>
  <span class="footer-sign">馆主 · <b data-site="owner">乌海舰</b></span>
  <span data-site="footerNote">个人影视资料库 · 仅作整理与收藏展示,不提供在线播放</span>
  <nav>
    <a href="index.html">首页</a>
    <a href="list.html">片库</a>
    <a href="index.html#categories">分类</a>
    <a href="admin.html">录入台</a>
  </nav>
</footer>

<nav class="tab-bar" aria-label="底部导航">
  <a href="index.html" data-nav="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/></svg>
    首页
  </a>
  <a href="list.html" data-nav="list">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    片库
  </a>
  <a href="index.html#categories">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>
    分类
  </a>
  <a href="list.html#q">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    搜索
  </a>
</nav>

<script src="assets/js/site.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
